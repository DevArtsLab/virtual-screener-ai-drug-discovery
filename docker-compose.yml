version: "3.9"

services:
  backend:
    build: ./backend
    container_name: virtualscreener-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/models:/app/models
      - ./backend/uploads:/app/uploads
      - ./backend/data:/app/data
    environment:
      - VINA_EXHAUSTIVENESS=16
      - VINA_TOP_K=10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: virtualscreener-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
